[project]
name = "vision-zero-copilot"
version = "0.1.0"
description = "Local-first ingestion and evidence tooling for Vision Zero Copilot."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.5",
  "openpyxl>=3.1",
  "pandas>=3.0",
  "pyarrow>=25.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
