# Approved deterministic evidence-engine behaviors.
templates:
  - id: ksi_trend
    version: 1
    status: implemented
    source_ids: [ksi_collisions]
    caveat_ids: [ksi_party_grain, counting_rules_unapproved, descriptive_not_causal]
    handler: ksi_trend
    location: optional
    parameters:
      start_year: {type: integer, required: true}
      end_year: {type: integer, required: true}
      buffer_meters: {type: integer, required: false}

  - id: collision_profile
    version: 1
    status: implemented
    source_ids: [traffic_collisions, ksi_collisions]
    caveat_ids: [ksi_party_grain, counting_rules_unapproved, descriptive_not_causal]
    handler: collision_profile
    location: optional
    parameters:
      start_year: {type: integer, required: true}
      end_year: {type: integer, required: true}
      buffer_meters: {type: integer, required: false}

  - id: intersection_safety_snapshot
    version: 1
    status: implemented
    source_ids: [traffic_collisions, ksi_collisions, toronto_intersection_file]
    caveat_ids: [ksi_party_grain, counting_rules_unapproved, descriptive_not_causal, location_match_uncertainty]
    handler: intersection_safety_snapshot
    location: required
    parameters:
      start_year: {type: integer, required: true}
      end_year: {type: integer, required: true}
      buffer_meters: {type: integer, required: false}

  - id: corridor_safety_snapshot
    version: 1
    status: implemented
    source_ids: [traffic_collisions, ksi_collisions, toronto_centreline]
    caveat_ids: [ksi_party_grain, counting_rules_unapproved, descriptive_not_causal, location_match_uncertainty, corridor_scope_approximation]
    handler: corridor_safety_snapshot
    location: required
    parameters:
      start_year: {type: integer, required: true}
      end_year: {type: integer, required: true}
      buffer_meters: {type: integer, required: false}

  - id: historical_ase_context
    version: 1
    status: implemented
    source_ids: [automated_speed_enforcement_locations, toronto_intersection_file]
    caveat_ids: [ase_historical_context_only, ase_locations_not_charges, location_match_uncertainty]
    handler: historical_ase_context
    location: required
    parameters:
      buffer_meters: {type: integer, required: false}

  - id: speed_volume_context
    version: 1
    status: implemented
    source_ids: [traffic_volume, toronto_centreline]
    caveat_ids: [traffic_volume_coverage_uneven, observed_speed_not_posted_limit, descriptive_not_causal, location_match_uncertainty]
    handler: speed_volume_context
    location: required
    parameters:
      buffer_meters: {type: integer, required: false}
      limit: {type: integer, required: false}

  - id: posted_speed_limit_lookup
    version: 1
    status: refused
    refusal_id: posted_speed_limit_source_missing

  - id: csz_status_lookup
    version: 1
    status: refused
    refusal_id: csz_structured_source_missing

  - id: turn_restriction_policy_history
    version: 1
    status: refused
    refusal_id: turn_restriction_source_missing

  - id: causal_evaluation
    version: 1
    status: refused
    refusal_id: causal_claim_not_supported

  - id: recommendation
    version: 1
    status: refused
    refusal_id: recommendation_not_supported
